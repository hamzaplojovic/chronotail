"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "./scripts/setup-dev.sh"
run_mode = "concurrent"

[scripts.run.check]
command = "./scripts/dev.sh quick"
icon = "test-tube"
default = true

[scripts.run.simulate]
command = "./scripts/dev.sh simulate"
icon = "shield-check"

[scripts.run.profile]
command = "./scripts/dev.sh profile full"
icon = "chart-no-axes-combined"
