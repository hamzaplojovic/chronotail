name: Release validation
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Validated native release bundle
    permissions:
      contents: write
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r'\.version\s*=\s*"([^"]+)"', pathlib.Path('build.zig.zon').read_text()).group(1)
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'tag/source version mismatch'
          notes = pathlib.Path('RELEASE_NOTES.md').read_text().split('\n# ', 1)[0]
          assert 'unreleased' not in notes.lower(), 'release notes still mark this version unreleased'
          PY
      - run: python3 scripts/setup-dev.py
      - run: ./scripts/dev.sh release
      - name: Validate installed wheel against the released old ABI-v2 library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/dev-env.sh
          mkdir -p .dev-results/old-abi-inputs
          gh release download v2.0.0 --repo hamzaplojovic/chronotail \
            --pattern chronotail-2.0.0-macos-aarch64.tar.gz \
            --dir .dev-results/old-abi-inputs
          version=$(python3 - <<'PY_VERSION'
          import pathlib, re
          print(re.search(r'\.version\s*=\s*"([^"]+)"', pathlib.Path('build.zig.zon').read_text()).group(1))
          PY_VERSION
          )
          new_bundle="dist/chronotail-${version}-macos-aarch64.tar.gz"
          new_sha=$(python3 - "$new_bundle" <<'PY_SHA'
          import hashlib, pathlib, sys
          print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())
          PY_SHA
          )
          python3 scripts/check-old-abi.py \
            --new-bundle "$new_bundle" --new-sha256 "$new_sha" --new-version "$version" \
            --old-bundle .dev-results/old-abi-inputs/chronotail-2.0.0-macos-aarch64.tar.gz \
            --old-sha256 148ba6f47fb31af1470bd95e6cb0691d39cc0e0f8a056bd3ed420dcc90fcfe34 \
            --old-release-receipt docs/releases/v2.0.0-compatibility.json \
            --require-links --output .dev-results/old-abi-compatibility.json
          python3 - <<'PY_RECEIPT'
          import json, pathlib
          receipt = json.loads(pathlib.Path('.dev-results/old-abi-compatibility.json').read_text())
          assert receipt['status'] == 'passed', 'old-ABI compatibility gate failed'
          assert receipt['release_compatibility_complete'] is True, 'old-ABI compatibility evidence incomplete'
          PY_RECEIPT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-release
          path: dist/
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-evidence
          path: .dev-results/
          include-hidden-files: true
          retention-days: 90
      - name: Publish the validated GitHub release
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          notes = Path('RELEASE_NOTES.md').read_text().split('\n# ', 1)[0]
          Path('.dev-results/release-notes.md').write_text(notes.rstrip() + '\n')
          PY
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "Chronotail ${RELEASE_TAG#v}" \
            --notes-file .dev-results/release-notes.md
