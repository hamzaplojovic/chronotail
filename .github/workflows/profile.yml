name: Paired resource experiment
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Git revision for the baseline (same runner, alternating order)
        required: true
        default: HEAD^
permissions:
  contents: read
concurrency:
  group: paired-profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: python3 scripts/setup-dev.py
      - name: Alternating experiment
        env:
          BASELINE: ${{ inputs.baseline }}
        run: python3 scripts/profile-pair.py "$BASELINE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: paired-diagnostic-evidence
          path: .dev-results/
          include-hidden-files: true
          retention-days: 30
