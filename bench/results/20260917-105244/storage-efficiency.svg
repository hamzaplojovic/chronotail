<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
<rect width="100%" height="100%" rx="8" fill="#ffffff"/>
<style>text{font-family:system-ui,sans-serif;font-size:14px}.title{font-size:20px;font-weight:600}.value{font-weight:600}</style>
<text class="title" x="20" y="30">Storage efficiency (lower is better)</text>
<text x="20" y="80">smooth / Chronotail raw</text>
<rect x="210" y="60" width="124.1" height="28" rx="3" fill="#2563eb"/>
