<text x="20" y="410">random / NanoTS</text>
<rect x="210" y="390" width="620.0" height="28" rx="3" fill="#ea580c"/>
<text class="value" x="840.0" y="410">80.02 bytes/point</text>
<text x="20" y="465">random / SQLite</text>
<rect x="210" y="445" width="289.9" height="28" rx="3" fill="#16a34a"/>
