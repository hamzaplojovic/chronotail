[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronotail"
version = "2.0.0"
description = "Python bindings for the embedded Chronotail time-series database"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Chronotail contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS :: MacOS X",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
chronotail = ["_native/*.dylib"]
