<text class="title" x="20" y="30">Query throughput</text>
<text class="subtitle" x="20" y="53">Warm OS page cache; every result is traversed and consumed</text>
<text class="label" x="20" y="106">Warm random point · chronotail</text><rect x="390" y="88" width="540.0" height="24" rx="4" fill="#2563eb"/><text class="value" x="940.0" y="106">1.88M queries/s</text><text class="label" x="20" y="148">Warm random point · nanots</text><rect x="390" y="130" width="252.7" height="24" rx="4" fill="#ea580c"/><text class="value" x="652.7" y="148">880.41k queries/s</text><text class="label" x="20" y="190">Warm random point · sqlite</text><rect x="390" y="172" width="60.3" height="24" rx="4" fill="#16a34a"/><text class="value" x="460.3" y="190">210.09k queries/s</text><text class="label" x="20" y="232">Warm raw 100-point range · chronotail</text><rect x="390" y="214" width="352.7" height="24" rx="4" fill="#2563eb"/><text class="value" x="752.7" y="232">1.23M queries/s</text><text class="label" x="20" y="274">Warm raw 100-point range · nanots</text><rect x="390" y="256" width="15.1" height="24" rx="4" fill="#ea580c"/><text class="value" x="415.1" y="274">52.70k queries/s</text><text class="label" x="20" y="316">Warm raw 100-point range · sqlite</text><rect x="390" y="298" width="12.8" height="24" rx="4" fill="#16a34a"/><text class="value" x="412.8" y="316">44.74k queries/s</text><text class="label" x="20" y="358">Warm compressed 100-point range · chronotail</text><rect x="390" y="340" width="47.7" height="24" rx="4" fill="#2563eb"/><text class="value" x="447.7" y="358">166.21k queries/s</text>
