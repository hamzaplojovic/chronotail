<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="399"
 viewBox="0 0 1080 399" role="img" aria-label="Query throughput">
<style>
 text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #172033; }
 .title { font-size: 22px; font-weight: 700; }
 .subtitle { font-size: 13px; fill: #59667d; }
 .label { font-size: 13px; }
