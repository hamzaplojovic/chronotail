<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc" style="background-color:#ffffff;color-scheme:light">
  <title id="title">Chronotail architecture</title>
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <desc id="desc">Zig, C, Python, and CLI APIs feed one specialized engine which writes append-only blocks and checkpoint generations read through immutable snapshots.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #172033; }
    .title { font-size: 23px; font-weight: 700; }
    .label { font-size: 16px; font-weight: 650; }
    .small { font-size: 13px; fill: #46536b; }
    .api { fill: #e8f0ff; stroke: #527bd8; stroke-width: 2; }
    .engine { fill: #e8fbf2; stroke: #21865b; stroke-width: 2; }
    .file { fill: #fff4df; stroke: #c47b18; stroke-width: 2; }
    .arrow { stroke: #68748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#68748b"/></marker></defs>
  <text class="title" x="30" y="38">One file. One writer. Immutable reader snapshots.</text>
  <g>
    <rect class="api" x="30" y="80" width="180" height="70" rx="10"/><text class="label" x="120" y="108" text-anchor="middle">Zig API</text><text class="small" x="120" y="132" text-anchor="middle">compile-time specialized</text>
    <rect class="api" x="260" y="80" width="180" height="70" rx="10"/><text class="label" x="350" y="108" text-anchor="middle">C ABI v1</text><text class="small" x="350" y="132" text-anchor="middle">9 stable symbols</text>
    <rect class="api" x="490" y="80" width="180" height="70" rx="10"/><text class="label" x="580" y="108" text-anchor="middle">Python</text><text class="small" x="580" y="132" text-anchor="middle">ctypes, bundled dylib</text>
    <rect class="api" x="720" y="80" width="180" height="70" rx="10"/><text class="label" x="810" y="108" text-anchor="middle">CLI</text><text class="small" x="810" y="132" text-anchor="middle">append · range · verify</text>
  </g>
  <path class="arrow" d="M120 150 V195 H390"/><path class="arrow" d="M350 150 V195 H430"/><path class="arrow" d="M580 150 V195 H530"/><path class="arrow" d="M810 150 V195 H570"/>
  <rect class="engine" x="260" y="195" width="440" height="100" rx="12"/>
  <text class="label" x="480" y="225" text-anchor="middle">Chronotail engine</text>
  <text class="small" x="480" y="250" text-anchor="middle">ordered append · adaptive blocks · checksums · recovery</text>
  <text class="small" x="480" y="273" text-anchor="middle">no runtime dependencies · no data-plane allocation after open</text>
  <path class="arrow" d="M480 295 V335"/>
  <rect class="file" x="85" y="335" width="790" height="105" rx="12"/>
  <text class="label" x="480" y="365" text-anchor="middle">Portable .ctdb format v6</text>
  <rect x="120" y="385" width="120" height="34" rx="5" fill="#ffdca5"/><text class="small" x="180" y="407" text-anchor="middle">file header</text>
  <rect x="255" y="385" width="190" height="34" rx="5" fill="#ffdca5"/><text class="small" x="350" y="407" text-anchor="middle">64 KiB data blocks</text>
  <rect x="460" y="385" width="180" height="34" rx="5" fill="#ffdca5"/><text class="small" x="550" y="407" text-anchor="middle">footer generations</text>
  <rect x="655" y="385" width="180" height="34" rx="5" fill="#ffdca5"/><text class="small" x="745" y="407" text-anchor="middle">checksummed trailer</text>
</svg>
